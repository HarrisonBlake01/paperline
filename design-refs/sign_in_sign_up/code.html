<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0B0B0F; /* Enforcing strict dark background from guidance */

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-[#0B0B0F] text-on-surface antialiased min-h-screen flex items-center justify-center p-gutter">
<!-- Main Container -->
<main class="w-full max-w-md">
<!-- Brand & Intro -->
<header class="mb-stack-lg text-center flex flex-col items-center">
<div class="w-12 h-12 bg-surface-container-high rounded-xl border border-outline-variant flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">layers</span>
</div>
<h1 class="font-h2 text-h2 text-on-surface mb-stack-xs">Paperline</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Turn documents into answers.</p>
</header>
<!-- Auth Card Surface -->
<div class="bg-surface rounded-xl border border-outline-variant p-gutter shadow-sm">
<!-- Toggle Tabs -->
<div class="flex border-b border-outline-variant mb-stack-md">
<button class="flex-1 pb-stack-sm border-b-2 border-primary font-label text-label text-primary font-semibold text-center transition-colors">Sign In</button>
<button class="flex-1 pb-stack-sm border-b-2 border-transparent font-label text-label text-on-surface-variant hover:text-on-surface text-center transition-colors">Sign Up</button>
</div>
<div class="mb-stack-lg">
<h2 class="font-h3 text-h3 text-on-surface mb-stack-sm">Welcome back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your credentials to access your workspace.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md mb-stack-lg">
<!-- Email Input -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label text-label text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-xs">
<div class="flex justify-between items-center">
<label class="font-label text-label text-on-surface" for="password">Password</label>
<a class="font-data-mono text-data-mono text-primary hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-on-primary-container font-label text-label py-3 rounded-xl transition-all flex items-center justify-center gap-2 mt-stack-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center justify-center mb-stack-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative bg-surface px-4 font-data-mono text-data-mono text-on-surface-variant uppercase tracking-wider text-[10px]">Or continue with</div>
</div>
<!-- SSO Options -->
<div class="flex flex-col gap-stack-sm">
<button class="w-full bg-transparent border border-outline-variant hover:border-primary hover:text-primary text-on-surface font-label text-label py-3 rounded-xl transition-colors flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="w-full bg-transparent border border-outline-variant hover:border-primary hover:text-primary text-on-surface font-label text-label py-3 rounded-xl transition-colors flex items-center justify-center gap-3" type="button">
<span class="material-symbols-outlined text-[20px]">key</span>
                    Enterprise SSO
                </button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-stack-lg text-center flex gap-stack-sm justify-center font-data-mono text-data-mono text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Privacy</a>
<span>•</span>
<a class="hover:text-primary transition-colors" href="#">Terms</a>
</div>
</main>
</body></html>
