name: Release gates

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPERLINE_RECRUITER_DEMO: "true"
      PAPERLINE_ALLOW_LIVE_STRIPE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate GitHub Actions workflow syntax
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          docker.io/rhysd/actionlint@sha256:96d4a8c87dbbfb3bdd324f8fdc285fc3df5261e2decc619a4dd7e8ee52bbfd46

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed text files for whitespace and final newlines
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            fi
          fi
          git diff --check "$base"..HEAD
          missing_final_newline=0
          while IFS= read -r -d '' file; do
            [[ -f "$file" && -s "$file" ]] || continue
            if LC_ALL=C grep -Iq . "$file"; then
              last_byte="$(LC_ALL=C tail -c 1 -- "$file" | od -An -t u1 | tr -d ' ')"
              if [[ "$last_byte" != "10" ]]; then
                printf 'Missing final newline: %s\n' "$file" >&2
                missing_final_newline=1
              fi
            fi
          done < <(git diff --name-only -z --diff-filter=ACMR "$base"..HEAD)
          (( missing_final_newline == 0 ))

      - name: Validate templates
        run: pnpm test:templates

      - name: Evaluate extraction fixtures
        run: pnpm test:extraction-eval

      - name: Validate demo readiness
        run: pnpm test:demo

      - name: Run security regression checks
        run: pnpm test:security

      - name: Run lifecycle and checkout regression checks
        run: pnpm test:lifecycle

      - name: Run lifecycle migration behavior checks
        run: pnpm test:lifecycle-db

      - name: Validate readiness behavior
        run: pnpm test:readiness

      - name: Validate parser runtime
        run: pnpm test:parser-runtime

      - name: Validate MCP behavior
        run: pnpm test:mcp

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ci-placeholder
          CLERK_SECRET_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan Git history and working tree
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
